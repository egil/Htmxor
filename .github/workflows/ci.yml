# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: ci
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  push:
    branches:
      - 'main'       # Run the workflow when pushing to the main branch
  pull_request:
    branches:
      - '*'          # Run the workflow for all pull requests
  schedule:
    - cron: '17 3 * * 1'
  release:
    types:
      - published    # Run the workflow when a new GitHub release is published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

jobs:
  create-nuget:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Get all history to allow automatic versioning using MinVer

    # Install the .NET SDK indicated in the global.json file
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Create the NuGet package in the folder from the environment variable NuGetDirectory
    - run: dotnet pack ./src/Htmxor/Htmxor.csproj --configuration Release --output ${{ env.NuGetDirectory }}

    # Publish the NuGet package as an artifact, so they can be used in the following jobs
    - uses: actions/upload-artifact@v4
      with:
        name: nuget
        if-no-files-found: error
        retention-days: 7
        path: ${{ env.NuGetDirectory }}/*.nupkg

  validate-nuget:
    runs-on: ubuntu-latest
    needs: [ create-nuget ]
    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Install nuget validator
        run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

      # Validate metadata and content of the NuGet package
      # https://www.nuget.org/packages/Meziantou.Framework.NuGetPackageValidation.Tool#readme-body-tab
      # If some rules are not applicable, you can disable them
      # using the --excluded-rules or --excluded-rule-ids option
      - name: Validate package
        shell: pwsh
        run: meziantou.validate-nuget-package (Get-ChildItem "${{ env.NuGetDirectory }}/*.nupkg") --excluded-rules IconMustBeSet

  run-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore local tools
      run: dotnet tool restore --tool-manifest .config/dotnet-tools.json

    - name: Run repository fast verification
      run: dotnet run --project eng/Htmxor.Quality/Htmxor.Quality.csproj -- check --profile fast

    - name: Build browser test project
      run: dotnet build test/Htmxor.Tests/Htmxor.Tests.csproj --configuration Release

    - name: Ensure browsers are installed
      run: pwsh test/Htmxor.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Run repository full verification
      run: dotnet run --project eng/Htmxor.Quality/Htmxor.Quality.csproj -- check --profile full

    - name: Append quality summaries
      if: always()
      shell: bash
      run: |
        if [ ! -d artifacts/results ]; then
          exit 0
        fi

        find artifacts/results -type f -name '*.md' -size -64k -print0 | sort -z | while IFS= read -r -d '' summary; do
          printf '\n## %s\n\n' "$(basename "$summary")" >> "$GITHUB_STEP_SUMMARY"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        done

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        if-no-files-found: error
        retention-days: 3
        path: artifacts/results/

    - name: Test Report
      uses: dorny/test-reporter@v1
      if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == 'egil/Htmxor'))
      with:
        name: test-results
        path: artifacts/results/**/*.trx
        path-replace-backslashes: 'true'
        reporter: dotnet-trx

  run-stryker:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore local tools
      run: dotnet tool restore --tool-manifest .config/dotnet-tools.json

    - name: Build browser test project
      run: dotnet build test/Htmxor.Tests/Htmxor.Tests.csproj --configuration Release

    - name: Ensure browsers are installed
      run: pwsh test/Htmxor.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

    - name: Run repository mutation verification
      id: mutation
      continue-on-error: true
      run: dotnet run --project eng/Htmxor.Quality/Htmxor.Quality.csproj -- check --profile mutation

    - name: Append mutation summaries
      if: always()
      shell: bash
      run: |
        if [ ! -d artifacts/results ]; then
          exit 0
        fi

        find artifacts/results -type f -name '*.md' -size -64k -print0 | sort -z | while IFS= read -r -d '' summary; do
          printf '\n## %s\n\n' "$(basename "$summary")" >> "$GITHUB_STEP_SUMMARY"
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
        done

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stryker-reports
        if-no-files-found: error
        retention-days: 3
        path: artifacts/results/

    - name: Enforce mutation quality result
      if: always()
      shell: bash
      env:
        MUTATION_OUTCOME: ${{ steps.mutation.outcome }}
      run: |
        if [ "$MUTATION_OUTCOME" != "success" ]; then
          echo "::error::Full-scope mutation verification reported an invalid run or documented mutation debt. Review the summary and uploaded characterization artifacts."
          exit 1
        fi

  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && github.repository == 'egil/Htmxor'
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v4
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v4

  infer-sharp:
    runs-on: ubuntu-latest
    if: github.event_name != 'release'
    permissions:
      security-events: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - run: dotnet build --configuration Release

    - name: Run Infer#
      uses: microsoft/infersharpaction@v1.5
      id: runinfersharp
      with:
        binary-path: ./src/Htmxor/bin/Release/net10.0
        github-sarif: true

    - name: Create step summary
      run: |
        echo # Infer# report >> $GITHUB_STEP_SUMMARY
        echo ``` >> $GITHUB_STEP_SUMMARY
        cat infer-out/report.txt >> $GITHUB_STEP_SUMMARY
        echo ``` >> $GITHUB_STEP_SUMMARY

    - name: Upload Infer# report as an artifact
      uses: actions/upload-artifact@v4
      with:
        name: infer-sharp-report
        path: infer-out/report.txt

    - name: Upload SARIF output to GitHub Security Center
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: infer-out/report.sarif

  deploy:
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    # You can update this logic if you want to manage releases differently
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    needs: [ validate-nuget, run-test ]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish NuGet package
        shell: pwsh
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
